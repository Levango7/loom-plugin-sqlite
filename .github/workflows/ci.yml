name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    # 「生态轴」外部自证：本插件作为**第三方包**，在干净 runner 上
    # 装正式版宿主（PyPI）后零改动地被发现、注册、执行——
    # 这同时是 Loom「外部仓发 Agent 包」验收线的活体判据。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
        # 宿主 import 名改名（pipeline_core → loom_core，3.11.0 起）的
        # 双路径兼容：旧版走旧名、新版走新名，插件两个都要能跑。
        nexusloom-version: ["3.10.0", "3.11.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 装宿主（PyPI 正式版）与本插件
        run: |
          python -m pip install --upgrade pip
          pip install "nexusloom==${{ matrix.nexusloom-version }}"
          pip install .

      - name: 零改动集成——插件被发现且带来源标记
        run: |
          loom plugin list | tee agents.txt
          grep -q "sqlite_query" agents.txt
          grep -q "entry_point:sqlite_query" agents.txt

      - name: 插件语义自检（只读/单语句/诚实降级/转义截断）
        run: python examples/self_check.py

      - name: 端到端——报表管线真跑真落盘
        run: |
          python examples/make_sample.py
          loom run examples/input.md --pipeline-file examples/sqlite-report.yaml -o output/sqlite-report.md
          test -s output/sqlite-report.md
          grep -q "订单快照" output/sqlite-report.md
          grep -q "| order_no |" output/sqlite-report.md
          grep -q "SO-1006" output/sqlite-report.md
          echo "--- 产物头 12 行 ---"
          head -12 output/sqlite-report.md

      - name: 审批闸门 × 插件——停住 → approve 放行 → reject 驳回（端到端）
        run: |
          python examples/approval_flow_check.py
